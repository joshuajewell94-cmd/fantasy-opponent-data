name: Weekly opponent data

on:
  schedule:
    # Every Wednesday at 11:00 UTC (7:00 AM Eastern during the season).
    # Late enough that Monday Night Football stats are in nflverse,
    # early enough to be ready before Thursday Night Football.
    - cron: "0 11 * 9-12,1 3"
    # Saturday 10:00 AM Eastern: refresh after Friday's final injury report.
    - cron: "0 14 * 9-12,1 6"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
    inputs:
      week:
        description: "Force a specific week (leave blank for auto)"
        required: false

permissions:
  contents: write           # lets the job commit the new JSON back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build opponent data
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python build_opponent_data.py --week "${{ github.event.inputs.week }}"
          else
            python build_opponent_data.py
          fi

      - name: Commit the new file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Opponent data: $(jq -r '"Week \(.week)"' data/latest.json)"
          git push
